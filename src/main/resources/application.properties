spring.application.name=tripmind-backend

server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tripmind_db
spring.datasource.username=tripmind_user
spring.datasource.password=TripMind@123

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SQL Formatting
spring.jpa.properties.hibernate.format_sql=true

groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1
groq.api.model=openai/gpt-oss-20b


jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

langchain4j.open-ai.chat-model.api-key=${GROQ_API_KEY}
langchain4j.open-ai.chat-model.base-url=https://api.groq.com/openai/v1
langchain4j.open-ai.chat-model.model-name=openai/gpt-oss-20b